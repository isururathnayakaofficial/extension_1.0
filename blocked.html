<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Blocked</title>
    <style>
        :root {
            --bg: #f3f5ff;
            --card: #ffffff;
            --accent: #3f51b5;
            --danger: #d32f2f;
            --text: #1f2937;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at top left, #e9edff, var(--bg));
            color: var(--text);
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(34, 44, 88, 0.16);
            padding: 28px;
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: var(--accent);
            border: 1px solid #dbe4ff;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 8px;
            font-size: 30px;
            line-height: 1.2;
            color: var(--danger);
        }

        p {
            margin: 10px 0;
            line-height: 1.6;
            font-size: 16px;
        }

        .site {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff4f4;
            border: 1px solid #ffdede;
            font-size: 14px;
        }

        .site strong {
            color: var(--danger);
        }

        .note {
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
<main class="card">
    <span class="badge">Focus Mode</span>
    <h1>Temporarily Blocked</h1>
    <p>This website is blocked right now because you have an active scheduled task.</p>
    <p>Stay focused on your current work session. Access is restored automatically when the session ends.</p>
    <div class="site">Blocked site: <strong id="blockedSite">this domain</strong></div>
    <p class="note">Reason: productivity protection during your task window.</p>
</main>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var site = params.get("site");
        if (site) {
            document.getElementById("blockedSite").textContent = site;
        }
    })();
</script>
</body>
</html>
